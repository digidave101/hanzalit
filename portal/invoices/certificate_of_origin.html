<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate of U.S.A. Origin — TI</title>
<style>
:root { --teal:#0a7b8a; --teal-dark:#065f6b; --gray-800:#333; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;font-size:13px;background:#f0f0f0;color:var(--gray-800);}
#toolbar{background:white;border-bottom:2px solid var(--teal);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;}
#toolbar h2{flex:1;font-size:16px;color:var(--teal-dark);}
.btn{padding:7px 14px;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none;display:inline-block;}
.btn-print{background:#333;color:white;}
.btn-back{background:#1a6b5a;color:white;}
#status{font-size:12px;color:#666;}
#preview{padding:20px;}
#doc{background:white;box-shadow:0 2px 12px rgba(0,0,0,0.1);max-width:900px;margin:0 auto;}
#welcome{padding:60px 20px;text-align:center;color:#888;}
@media print {
  body{background:white;}
  #toolbar,#welcome{display:none !important;}
  #preview{padding:0;}
  #doc{box-shadow:none;max-width:none;}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
}
</style>
</head>
<body>
<div id="toolbar" class="no-print">
  <h2>📋 Certificate of U.S.A. Origin</h2>
  <span id="status">Loading...</span>
  <button class="btn btn-print" onclick="printCOO()">🖨 Print / Save PDF</button>
  <a class="btn btn-back" id="back-link" href="/portal/invoices/">← Back to Invoice</a>
</div>

<div id="welcome">
  <h3 style="color:var(--teal);margin-bottom:12px;">Certificate of Origin</h3>
  <p>Open from an invoice using the <strong>Cert. of Origin</strong> button, or add <code>?inv=ID</code> to this page's URL.</p>
  <p style="margin-top:14px;"><a href="/portal/invoices/" style="color:var(--teal);font-weight:700;text-decoration:none;">→ Open Invoice Manager</a></p>
</div>

<div id="preview" style="display:none;">
  <div id="doc"></div>
</div>

<script>
const AUTH = (() => {
  try {
    const s = sessionStorage.getItem('tikitmeer_auth');
    return s ? JSON.parse(s) : { user: 'dhanzal', pass: 'aA292199', name: 'David Hanzal' };
  } catch(e) {
    return { user: 'dhanzal', pass: 'aA292199', name: 'David Hanzal' };
  }
})();

const API_BASE = '/portal/invoices/invoice-api.php';
let currentInv = null;
let currentPl = null;

async function api(action, data = {}) {
  const r = await fetch(API_BASE, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action, auth_user: AUTH.user, auth_pass: AUTH.pass, ...data})
  });
  const j = await r.json();
  if (!j.success) throw new Error(j.error || 'API error');
  return j;
}

async function getSignatureB64() {
  const endpoints = ['/portal/invoices/invoice-api.php', '/portal/invoices/po-api.php'];
  for (const url of endpoints) {
    try {
      const r = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'getSignature', auth_user: AUTH.user, auth_pass: AUTH.pass})
      });
      const j = await r.json();
      if (j.success && j.dataUrl) return j.dataUrl;
      if (j.success && j.url) return j.url;
    } catch(e) {}
  }
  return 'https://ti-kitmeer.com/portal/admin/secure_assets/signature.png';
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }

function parseLineItems(inv) {
  let raw = inv.line_items;
  if (!raw) return [];
  if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch(e) {} }
  if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch(e) {} }
  return Array.isArray(raw) ? raw : [];
}

function guessManufacturers(lineItems) {
  const mfrs = new Set();
  (lineItems || []).forEach(it => {
    if (it.manufacturer) { mfrs.add(it.manufacturer); }
  });
  return [...mfrs];
}

function firstLine(text) {
  if (!text) return '';
  return String(text).split('\n').map(l => l.trim()).filter(Boolean)[0] || '';
}

/** Parse "City, ST" / "City, ST ZIP, Country" from a single address line */
function parseLocationLine(line) {
  if (!line) return null;
  let m = line.match(/^([^,]+),\s*([A-Za-z]{2,})\s+(\d{5})?(?:,?\s*(.+))?$/);
  if (m) {
    const country = (m[4] || '').trim();
    return {
      city: m[1].trim(),
      state: m[2].trim(),
      country,
      full: country ? `${m[1].trim()}, ${m[2].trim()}, ${country}` : `${m[1].trim()}, ${m[2].trim()}`
    };
  }
  m = line.match(/^([^,]+),\s*([^,]+)(?:,\s*(.+))?$/);
  if (m) {
    const city = m[1].trim();
    const mid = m[2].trim();
    const country = (m[3] || '').trim();
    if (/^[A-Za-z]{2}$/.test(mid)) {
      return {
        city,
        state: mid,
        country,
        full: country ? `${city}, ${mid}, ${country}` : `${city}, ${mid}`
      };
    }
    return { city, state: '', country: mid, full: country ? `${city}, ${mid}, ${country}` : `${city}, ${mid}` };
  }
  return null;
}

function extractCountryFromAddress(text) {
  const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
  for (let i = lines.length - 1; i >= 0; i--) {
    const loc = parseLocationLine(lines[i]);
    if (loc?.country) return loc.country;
    const parts = lines[i].split(',').map(p => p.trim());
    if (parts.length >= 2) {
      const last = parts[parts.length - 1].replace(/\d{5}.*$/, '').trim();
      if (last.length >= 2 && !/^\d+$/.test(last) && !/^\d{3,}/.test(last)) return last;
    }
    if (i === lines.length - 1 && lines.length > 1 && !lines[i].match(/\d{3,}/)) return lines[i];
  }
  return '';
}

/** Point (State) of Origin = manufacturer city & state, not TI's New York address */
function cityStateFromManufacturer(mfr) {
  const lines = String(mfr || '').split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return '';
  for (let i = 1; i < lines.length; i++) {
    const loc = parseLocationLine(lines[i]);
    if (loc) return loc.full;
  }
  if (lines.length === 2) return lines[1];
  return '';
}

function normalizeCountryKey(country) {
  const c = String(country || '').toUpperCase().trim();
  if (!c) return 'USA';
  if (c.includes('UAE') || c.includes('EMIRATES') || c === 'U.A.E.') return 'UAE';
  if (c.includes('SAUDI') || c === 'KSA' || c.includes('KINGDOM OF SAUDI')) return 'SA';
  if (c.includes('KUWAIT')) return 'KW';
  if (c.includes('QATAR')) return 'QA';
  if (c.includes('BAHRAIN')) return 'BH';
  if (c.includes('OMAN')) return 'OM';
  if (c.includes('EGYPT')) return 'EG';
  if (c.includes('JORDAN')) return 'JO';
  if (c.includes('LEBANON')) return 'LB';
  if (c.includes('IRAQ')) return 'IQ';
  if (c.includes('MOROCCO')) return 'MA';
  if (c.includes('INDIA')) return 'IN';
  if (c.includes('PAKISTAN')) return 'PK';
  if (c.includes('UK') || c.includes('UNITED KINGDOM') || c.includes('ENGLAND')) return 'UK';
  if (c.includes('USA') || c.includes('UNITED STATES') || c === 'US' || c === 'U.S.A.') return 'USA';
  return c;
}

const COUNTRY_PORTS = {
  USA: { ocean: 'New York Port', air: 'New York Airport' },
  UAE: { ocean: 'Dubai Port', air: 'Dubai Airport' },
  SA:  { ocean: 'Jeddah Port', air: 'King Khalid Airport, Riyadh' },
  KW:  { ocean: 'Shuwaikh Port', air: 'Kuwait Airport' },
  QA:  { ocean: 'Doha Port', air: 'Hamad Airport' },
  BH:  { ocean: 'Khalifa Port', air: 'Bahrain Airport' },
  OM:  { ocean: 'Sohar Port', air: 'Muscat Airport' },
  EG:  { ocean: 'Alexandria Port', air: 'Cairo Airport' },
  JO:  { ocean: 'Aqaba Port', air: 'Queen Alia Airport' },
  LB:  { ocean: 'Beirut Port', air: 'Beirut Airport' },
  IQ:  { ocean: 'Umm Qasr Port', air: 'Baghdad Airport' },
  MA:  { ocean: 'Casablanca Port', air: 'Casablanca Airport' },
  IN:  { ocean: 'Mumbai Port', air: 'Mumbai Airport' },
  PK:  { ocean: 'Karachi Port', air: 'Karachi Airport' },
  UK:  { ocean: 'Felixstowe Port', air: 'Heathrow Airport' },
};

function freightMode(inv) {
  if (inv.freight_mode === 'air' || inv.freight_mode === 'ocean') return inv.freight_mode;
  const text = `${inv.incoterms || ''} ${inv.carrier || ''} ${inv.type_of_move || ''} ${inv.notes || ''}`.toUpperCase();
  if (/\bAIR\b|AIRWAY|AWB|AIR FREIGHT|AIRFREIGHT/.test(text)) return 'air';
  return 'ocean';
}

function formatPort(country, mode) {
  const key = normalizeCountryKey(country);
  const entry = COUNTRY_PORTS[key];
  if (entry) return entry[mode] || entry.ocean;
  const label = country || key || '—';
  return mode === 'air' ? `${label} Airport` : `${label} Port`;
}

function billToBlock(inv) {
  const name = (inv.client_name || '').trim();
  const addr = (inv.client_addr || '').trim();
  if (name && addr) {
    if (addr.toUpperCase().indexOf(name.toUpperCase()) === 0) return addr;
    return name + '\n' + addr;
  }
  return name || addr || '';
}

function defaultTypeOfMove(inv, mode) {
  const inco = (inv.incoterms || '').trim() || 'Ex Works';
  return `${inco} - ${mode === 'air' ? 'Air Freight' : 'Ocean Freight'}`;
}

function in2cm(v) { return v ? (parseFloat(v) * 2.54).toFixed(1) : '—'; }
function lbs2kgNum(lbs) { return (parseFloat(lbs) * 0.453592); }

/** Weight from packing list piece */
function pieceWeightLbs(p) {
  const w = parseFloat(p.weight_lbs ?? p.gross_lbs ?? p.net_lbs);
  if (!isNaN(w) && w > 0) return w;
  return null;
}

function fmtPieceWeight(p) {
  const lbs = pieceWeightLbs(p);
  if (lbs === null) return '—';
  const kg = lbs2kgNum(lbs).toFixed(2);
  return `${lbs} lbs\n(${kg} Kg)`;
}

function pieceDims(p) {
  if (!p.len_in && !p.wid_in && !p.ht_in) return '—';
  const lCm = in2cm(p.len_in), wCm = in2cm(p.wid_in), hCm = in2cm(p.ht_in);
  return `${p.len_in || '—'}" × ${p.wid_in || '—'}" × ${p.ht_in || '—'}"\n(${lCm} × ${wCm} × ${hCm} cm)`;
}

function pieceDesc(p, goodsDesc) {
  const items = (p.items || []).filter(it => it.item_num).map(it => it.item_num + (it.qty > 1 ? ` ×${it.qty}` : '')).join(', ');
  return items || goodsDesc;
}

function buildGoodsRows(pieces, goodsDesc) {
  if (pieces && pieces.length) {
    let rows = '';
    let totalLbs = 0;
    pieces.forEach((p, i) => {
      const lbs = pieceWeightLbs(p);
      if (lbs !== null) totalLbs += lbs;
      rows += `<tr style="background:${i % 2 === 0 ? '#fff' : '#fafafa'};">
        <td style="padding:6px 8px;vertical-align:top;border-bottom:1px solid #ddd;font-weight:700;color:#0a7b8a;">${esc(p.label || 'Piece ' + (i + 1))}</td>
        <td style="padding:6px 8px;text-align:center;vertical-align:top;border-bottom:1px solid #ddd;">1</td>
        <td style="padding:6px 8px;vertical-align:top;border-bottom:1px solid #ddd;white-space:pre-wrap;">${esc(pieceDesc(p, goodsDesc))}</td>
        <td style="padding:6px 8px;text-align:center;vertical-align:top;border-bottom:1px solid #ddd;font-size:9px;white-space:pre-wrap;">${esc(pieceDims(p))}</td>
        <td style="padding:6px 8px;text-align:center;vertical-align:top;border-bottom:1px solid #ddd;font-size:9px;font-weight:700;white-space:pre-wrap;">${esc(fmtPieceWeight(p))}</td>
      </tr>`;
    });
    const totalKg = totalLbs > 0 ? lbs2kgNum(totalLbs).toFixed(2) : '—';
    const totalCell = totalLbs > 0
      ? `${totalLbs.toFixed(2)} lbs\n(${totalKg} Kg)`
      : '—';
    rows += `<tr style="background:#0a7b8a;color:white;font-weight:700;">
      <td style="padding:6px 8px;text-align:right;" colspan="4">TOTAL — ${pieces.length} piece${pieces.length !== 1 ? 's' : ''}</td>
      <td style="padding:6px 8px;text-align:center;font-size:9px;white-space:pre-wrap;">${esc(totalCell)}</td>
    </tr>`;
    return rows;
  }
  return `<tr style="background:#fafafa;">
    <td style="padding:7px 8px;vertical-align:top;border-bottom:1px solid #ddd;">—</td>
    <td style="padding:7px 8px;text-align:center;vertical-align:top;border-bottom:1px solid #ddd;">1</td>
    <td style="padding:7px 8px;vertical-align:top;border-bottom:1px solid #ddd;">${esc(goodsDesc)}</td>
    <td style="padding:7px 8px;text-align:center;vertical-align:top;border-bottom:1px solid #ddd;">—</td>
    <td style="padding:7px 8px;text-align:center;vertical-align:top;border-bottom:1px solid #ddd;font-weight:700;">—</td>
  </tr>`;
}

function lastLine(text) {
  if (!text) return '';
  const lines = String(text).split('\n').map(l => l.trim()).filter(Boolean);
  return lines.length ? lines[lines.length - 1] : '';
}

function ordinalDate(dateStr) {
  const d = new Date((dateStr || new Date().toISOString().split('T')[0]) + 'T12:00:00');
  const day = d.getDate();
  const suffix = (day > 3 && day < 21) ? 'th' : ['th','st','nd','rd'][day % 10 > 3 ? 0 : day % 10];
  const month = d.toLocaleDateString('en-US', {month: 'long'}).toUpperCase();
  return `${day}${suffix} DAY OF ${month}, ${d.getFullYear()}`;
}

function fmtDate(dateStr) {
  return new Date((dateStr || new Date().toISOString().split('T')[0]) + 'T12:00:00')
    .toLocaleDateString('en-US', {year: 'numeric', month: 'long', day: 'numeric'});
}

const TI_BLOCK = `<strong>TECHNOLOGIES INTERNATIONAL, LLC</strong><br>
3149 Broadway, Suite 16<br>New York, NY 10027<br>
Phone: 646.216.9043 / Fax: 646.706.9043`;

function fieldRow(label, value, label2, value2) {
  if (label2) {
    return `<tr>
      <td style="width:18%;padding:6px 8px;background:#e8f4f6;font-size:9px;font-weight:700;color:#065f6b;text-transform:uppercase;vertical-align:top;border:1px solid #ccc;">${label}</td>
      <td style="width:32%;padding:6px 8px;font-size:10px;vertical-align:top;border:1px solid #ccc;white-space:pre-wrap;">${value}</td>
      <td style="width:18%;padding:6px 8px;background:#e8f4f6;font-size:9px;font-weight:700;color:#065f6b;text-transform:uppercase;vertical-align:top;border:1px solid #ccc;">${label2}</td>
      <td style="width:32%;padding:6px 8px;font-size:10px;vertical-align:top;border:1px solid #ccc;white-space:pre-wrap;">${value2}</td>
    </tr>`;
  }
  return `<tr>
    <td style="width:18%;padding:6px 8px;background:#e8f4f6;font-size:9px;font-weight:700;color:#065f6b;text-transform:uppercase;vertical-align:top;border:1px solid #ccc;">${label}</td>
    <td colspan="3" style="padding:6px 8px;font-size:10px;vertical-align:top;border:1px solid #ccc;white-space:pre-wrap;">${value}</td>
  </tr>`;
}

function buildPrintHTML(inv, pl, sigDataUrl) {
  const lineItems = pl?.lineItems || parseLineItems(inv);
  const pieces = pl?.pieces || [];
  const goodsDesc = pl?.goods_desc || 'Technical training equipment and systems';

  // Manufacturer from invoice — user must set on invoice (no Amatrol default)
  let manufacturer = (inv.manufacturer || '').trim();
  if (!manufacturer) {
    const fromItems = guessManufacturers(lineItems);
    manufacturer = fromItems.length ? fromItems.join('\n\n') : '';
  }
  const factory = firstLine(manufacturer) || '—';
  if (!manufacturer) manufacturer = '— Set Manufacturer on invoice (Shipping Details)';

  const mode = freightMode(inv);
  const mfrCountry = extractCountryFromAddress(manufacturer) || inv.country_of_origin || 'USA';
  const destCountry = extractCountryFromAddress(inv.end_user) || extractCountryFromAddress(inv.client_addr) || extractCountryFromAddress(inv.ship_to) || '';

  const pointOrigin = cityStateFromManufacturer(manufacturer) || mfrCountry || '—';
  const portLoad = (inv.port_loading || '').trim() || formatPort(mfrCountry, mode);
  const portUnload = (inv.port_unloading || '').trim()
    || (destCountry ? formatPort(destCountry, mode) : (lastLine(inv.end_user) || lastLine(inv.client_addr) || '—'));

  const typeMove = (inv.type_of_move || '').trim() || defaultTypeOfMove(inv, mode);
  const consigneeBillTo = billToBlock(inv) || inv.client_name || '—';
  const fwdAgent = inv.carrier || '—';
  const certDate = ordinalDate(inv.inv_date || pl?.pl_date);
  const today = fmtDate(inv.inv_date || pl?.pl_date);
  const invNum = inv.inv_number || '';
  const poNum = inv.po_number || '';
  const clientName = inv.client_name || '';
  const quoteRef = inv.quote_number || '';
  const incoterms = inv.incoterms || '';
  const origin = inv.country_of_origin || 'USA';
  const docRef = invNum || 'COO';

  const sigImgTag = sigDataUrl
    ? `<img src="${sigDataUrl}" alt="Signature" style="height:44px;max-width:170px;display:block;margin:0 0 3px 0">`
    : '';

  const headerHtml = `<tr><td colspan="100" style="padding-bottom:6px;">
    <table style="width:100%;border-collapse:collapse;">
      <tr>
        <td style="width:55%;vertical-align:top;">
          <img src="https://ti-kitmeer.com/images/TIlogo.png" style="height:72px;max-width:340px;object-fit:contain;display:block;margin-bottom:3px;" alt="Technologies International LLC">
          <div style="font-size:9px;color:#666;">3149 Broadway, Suite 16 · New York, NY 10027 · USA</div>
          <div style="font-size:9px;color:#666;">Tel: +1 (212) 217-9795 · david@tieducational.com · tieducational.com</div>
        </td>
        <td style="text-align:right;vertical-align:top;">
          <div style="font-size:17px;font-weight:700;color:#0a7b8a;letter-spacing:1.5px;line-height:1.2;">CERTIFICATE OF<br>U.S.A. ORIGIN</div>
          <div style="font-size:10px;color:#333;margin-top:4px;"><strong>${esc(invNum)}</strong></div>
          <div style="font-size:9px;color:#666;">${today}</div>
          ${poNum ? `<div style="font-size:9px;font-weight:700;color:#333;margin-top:2px;">Client PO: ${esc(poNum)}</div>` : ''}
        </td>
      </tr>
    </table>
    <div style="height:3px;background:#0a7b8a;border-radius:2px;margin-top:5px;"></div>
    <table style="width:100%;border-collapse:collapse;font-size:9px;margin-top:4px;">
      <tr style="background:#e8f4f6;">
        ${clientName ? `<td style="padding:3px 8px;"><strong>Client:</strong> ${esc(clientName)}</td>` : ''}
        ${quoteRef ? `<td style="padding:3px 8px;"><strong>Quote Ref:</strong> ${esc(quoteRef)}</td>` : ''}
        ${incoterms ? `<td style="padding:3px 8px;"><strong>Incoterms:</strong> ${esc(incoterms)}</td>` : ''}
        <td style="padding:3px 8px;"><strong>Origin:</strong> ${esc(origin)}</td>
      </tr>
    </table>
  </td></tr>`;

  const footerHtml = `<tr><td colspan="100" style="padding-top:6px;">
    <div style="border-top:2px solid #0a7b8a;padding-top:5px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:8px;color:#888;min-width:90px;">${today}</span>
      <span style="text-align:center;flex:1;">
        <span style="font-size:9px;font-weight:700;color:#0a7b8a;">Technologies International, LLC &nbsp;&middot;&nbsp; tieducational.com</span>
        <br><span style="font-size:7.5px;color:#999;">3149 Broadway, Suite 16, New York, NY 10027 USA &nbsp;&middot;&nbsp; Tel: +1 (212) 217-9795</span>
      </span>
      <span style="font-size:8px;color:#888;min-width:90px;text-align:right;">${esc(docRef)}</span>
    </div>
  </td></tr>`;

  const fieldsHtml = `<tr><td colspan="100" style="padding-bottom:8px;">
    <table style="width:100%;border-collapse:collapse;">
      ${fieldRow('Factory', nl2br(factory), 'Date', esc(today))}
      ${fieldRow('Shipper / Supplier<br>Name &amp; Address', TI_BLOCK)}
      ${fieldRow('Forwarding Agent<br>Name &amp; Address', nl2br(fwdAgent))}
      ${fieldRow('Exporter of Record', TI_BLOCK)}
      ${fieldRow('Consignee / Bill To', nl2br(consigneeBillTo))}
      ${fieldRow('Point (State) of Origin', esc(pointOrigin), 'Port of Loading', esc(portLoad))}
      ${fieldRow('Port of Unloading', esc(portUnload), 'Type of Move', esc(typeMove))}
    </table>
  </td></tr>`;

  const goodsHtml = `<tr><td colspan="100" style="padding-bottom:8px;">
    <table style="width:100%;border-collapse:collapse;font-size:10px;">
      <tr style="background:#0a7b8a;color:white;">
        <th style="padding:7px 8px;width:18%;text-align:left;">Marks</th>
        <th style="padding:7px 8px;width:6%;text-align:center;">Pcs.</th>
        <th style="padding:7px 8px;text-align:left;">Description of Goods &amp;/or Services</th>
        <th style="padding:7px 8px;width:22%;text-align:center;">Dimensions (in / cm)</th>
        <th style="padding:7px 8px;width:12%;text-align:center;">Weight</th>
      </tr>
      ${buildGoodsRows(pieces, goodsDesc)}
    </table>
  </td></tr>`;

  const mfrHtml = `<tr><td colspan="100" style="padding-bottom:8px;">
    <table style="width:100%;border-collapse:collapse;">
      ${fieldRow('Name &amp; Address of Manufacturer', nl2br(manufacturer))}
    </table>
  </td></tr>`;

  const certHtml = `<tr><td colspan="100">
    <table style="width:100%;border-collapse:collapse;font-size:10px;border:1px solid #ddd;">
      <tr>
        <td style="width:62%;vertical-align:top;padding:10px 12px;border-right:1px solid #ddd;">
          <div style="font-size:9px;font-weight:700;color:#0a7b8a;text-transform:uppercase;margin-bottom:6px;">Certification Statement</div>
          <div style="font-size:10px;color:#333;line-height:1.55;text-align:justify;">
            THE UNDERSIGNED, <strong>DAVID W. HANZAL</strong> (PRESIDENT) DOES HEREBY DECLARE AND CERTIFY FOR THE
            ABOVE NAMED MANUFACTURER THAT THE GOODS AS DESCRIBED ABOVE WERE SHIPPED AND CONSIGNED AS INDICATED AND
            ARE PRODUCTS OF <strong>U.S.A. ORIGIN</strong>. DATED THIS ${certDate}.
          </div>
        </td>
        <td style="vertical-align:top;padding:10px 12px;">
          <div style="font-size:9px;font-weight:700;color:#0a7b8a;text-transform:uppercase;margin-bottom:6px;">Authorized Signatory</div>
          ${sigImgTag}
          <div style="font-weight:700;font-size:10px;border-top:1px solid #333;padding-top:4px;margin-top:4px;">David W. Hanzal</div>
          <div style="color:#666;font-size:9px;">President, Technologies International, LLC</div>
          <div style="color:#666;font-size:9px;margin-top:3px;">Date: ${today}</div>
        </td>
      </tr>
    </table>
  </td></tr>`;

  return `<style>
    @media print {
      *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
      @page{size:letter;margin:0.45in 0.5in 0.65in 0.5in;}
      body{font-family:Arial,sans-serif;font-size:10px;}
      thead{display:table-header-group;}
      tfoot{display:table-footer-group;}
      tbody{display:table-row-group;}
    }
    body{font-family:Arial,sans-serif;font-size:10px;margin:0;padding:16px;}
  </style>
  <table style="width:100%;border-collapse:collapse;">
    <thead>${headerHtml}</thead>
    <tfoot>${footerHtml}</tfoot>
    <tbody>
      ${fieldsHtml}
      ${goodsHtml}
      ${mfrHtml}
      ${certHtml}
    </tbody>
  </table>`;
}

async function renderCOO() {
  if (!currentInv) return;
  const sig = await getSignatureB64();
  document.getElementById('doc').innerHTML = buildPrintHTML(currentInv, currentPl, sig);
}

async function openPrintWindow() {
  const sig = await getSignatureB64();
  const html = buildPrintHTML(currentInv, currentPl, sig);
  const invNum = currentInv?.inv_number || 'Certificate-of-Origin';
  const safeRef = invNum.replace(/'/g, "\\'");
  const pageStyle = `<style>
@page {
  size: letter;
  margin: 0.45in 0.5in 0.42in 0.5in;
  @bottom-right {
    content: "Page " counter(page) " of " counter(pages) "  ·  ${safeRef}";
    font-family: Arial, sans-serif;
    font-size: 8px;
    color: #888;
    padding-top: 2px;
  }
}
</style>`;
  const fullHTML = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + invNum + ' — COO</title>' + pageStyle + '</head><body style="margin:0;padding:0;font-family:Arial,sans-serif;">' + html + '<script>window.onload=function(){setTimeout(function(){window.print();},400);};<\/script></body></html>';
  const blob = new Blob([fullHTML], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank');
  if (!win) { alert('Please allow popups for this site.'); return; }
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

async function loadInvoice(id) {
  document.getElementById('status').textContent = 'Loading invoice...';
  try {
    const r = await api('get_invoice', {id});
    currentInv = r.invoice;
    // Ensure full manufacturer address for COO (server resolves; client fallback)
    if (currentInv.manufacturer && !currentInv.manufacturer.includes('\n')) {
      try {
        const mr = await api('get_manufacturer_address', { name: currentInv.manufacturer.split('\n')[0] });
        if (mr.address && (mr.address.includes('\n') || mr.has_full_address)) {
          currentInv.manufacturer = mr.address;
        }
      } catch(e) {}
    }
    if (currentInv.pl_data) {
      try { currentPl = typeof currentInv.pl_data === 'string' ? JSON.parse(currentInv.pl_data) : currentInv.pl_data; }
      catch(e) { currentPl = null; }
    } else { currentPl = null; }
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('preview').style.display = 'block';
    document.getElementById('back-link').href = '/portal/invoices/?inv=' + id;
    document.getElementById('status').textContent = (currentInv.inv_number || 'Invoice') + (currentPl ? ' · PL loaded' : ' · No PL saved');
    await renderCOO();
  } catch(e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
}

async function printCOO() {
  if (!currentInv) { alert('No invoice loaded.'); return; }
  await openPrintWindow();
}

document.addEventListener('DOMContentLoaded', () => {
  const invParam = new URLSearchParams(window.location.search).get('inv');
  if (invParam) loadInvoice(parseInt(invParam, 10));
  else document.getElementById('status').textContent = 'No invoice selected — open from Invoice Manager';
});
</script>
