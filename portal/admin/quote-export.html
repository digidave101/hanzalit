<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quote Export — TI Kitmeer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* ── SCREEN STYLES ── */
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f0f0f0;
  margin: 0;
  padding: 20px;
  color: #222;
}
.screen-bar {
  background: #1a1400;
  color: #dc8c1e;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  border-radius: 6px;
}
.screen-bar a { color: #a07030; font-size: 13px; text-decoration: none; border: 1px solid #3a2a0a; padding: 5px 12px; border-radius: 5px; }
.screen-bar a:hover { color: #dc8c1e; }
.screen-bar .spacer { flex: 1; }
.btn-print {
  background: #dc8c1e; color: #000; border: none; padding: 9px 22px;
  border-radius: 5px; font-weight: 700; cursor: pointer; font-size: 14px;
}
.btn-print:hover { background: #f0a030; }
.loading { text-align: center; padding: 60px; color: #888; font-size: 16px; }

/* ── DOCUMENT WRAPPER ── */
.doc {
  background: #fff;
  max-width: 780px;
  margin: 0 auto;
  padding: 48px 52px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.15);
  border-radius: 4px;
}

/* ── HEADER ── */
.doc-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  border-bottom: 3px solid #dc8c1e;
  padding-bottom: 20px;
  margin-bottom: 28px;
}
.doc-header .company-name {
  font-size: 22px;
  font-weight: 700;
  color: #1a1400;
  letter-spacing: 0.04em;
}
.doc-header .company-sub {
  font-size: 11px;
  color: #888;
  margin-top: 3px;
}
.doc-header .doc-label {
  text-align: right;
}
.doc-header .doc-label .title {
  font-size: 26px;
  font-weight: 700;
  color: #dc8c1e;
  letter-spacing: 0.06em;
}
.doc-header .doc-label .quotenum {
  font-size: 13px;
  color: #555;
  margin-top: 4px;
  font-family: 'Courier New', monospace;
}

/* ── META GRID ── */
.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 28px;
}
.meta-cell {
  padding: 11px 16px;
  border-bottom: 1px solid #e0e0e0;
  border-right: 1px solid #e0e0e0;
}
.meta-cell:nth-child(even) { border-right: none; }
.meta-cell:nth-last-child(-n+2) { border-bottom: none; }
.meta-cell label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #999;
  display: block;
  margin-bottom: 3px;
}
.meta-cell p {
  font-size: 13px;
  font-weight: 600;
  color: #222;
  margin: 0;
}
.meta-cell.full { grid-column: 1 / -1; border-right: none; }
.status-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}
.status-active  { background: #e8f5e9; color: #2e7d32; }
.status-won     { background: #e3f2fd; color: #1565c0; }
.status-lost    { background: #ffebee; color: #c62828; }
.status-pending { background: #fff8e1; color: #f57f17; }
.status-hold    { background: #f5f5f5; color: #757575; }

/* ── SECTION HEADERS ── */
.sec-head {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #dc8c1e;
  font-weight: 700;
  border-bottom: 1px solid #f0c060;
  padding-bottom: 5px;
  margin: 28px 0 14px;
}

/* ── PRICING TABLE ── */
.price-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.price-table th {
  background: #fdf6e8;
  color: #7a4a00;
  padding: 9px 12px;
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 2px solid #f0c060;
}
.price-table td {
  padding: 10px 12px;
  border-bottom: 1px solid #f0f0f0;
  vertical-align: middle;
}
.price-table tr:last-child td { border-bottom: none; }
.price-table .r-label {
  font-weight: 700;
  color: #1a1400;
  width: 40px;
}
.price-table .price-val {
  font-weight: 700;
  color: #2e7d32;
  font-size: 14px;
  text-align: right;
}
.price-table .price-na {
  color: #bbb;
  font-style: italic;
  text-align: right;
}
.price-table .latest-row td {
  background: #fdf6e8;
  border-top: 2px solid #f0c060;
  border-bottom: 2px solid #f0c060;
}
.price-table .latest-row .r-label { color: #dc8c1e; }
.price-table .divisor { color: #888; font-size: 12px; }

/* ── NOTES ── */
.notes-box {
  background: #fafafa;
  border: 1px solid #e8e8e8;
  border-left: 4px solid #dc8c1e;
  padding: 12px 16px;
  border-radius: 0 4px 4px 0;
  font-size: 13px;
  color: #444;
  margin-bottom: 28px;
}

/* ── FOOTER ── */
.doc-footer {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid #e0e0e0;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #aaa;
}

/* ── PRINT STYLES ── */
@media print {
  body { background: #fff; padding: 0; }
  .screen-bar { display: none !important; }
  .doc {
    box-shadow: none;
    padding: 0;
    max-width: 100%;
    border-radius: 0;
  }
  .doc-header { border-bottom-color: #dc8c1e; }
  @page {
    margin: 18mm 15mm;
    size: A4;
  }
  .price-table { page-break-inside: avoid; }
}
</style>
</head>
<body>

<div class="screen-bar">
  <span style="font-size:15px;font-weight:700">TI Kitmeer</span>
  <a href="/portal/admin/projects.html">← Back to Projects</a>
  <div class="spacer"></div>
  <button class="btn-print" onclick="window.print()">🖨 Print / Save as PDF</button>
</div>

<div id="doc" class="loading">Loading quote data…</div>

<script>
var API = '/portal/admin/projects-api.php';

function getParam(name) {
  var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}

function fmtN(n) {
  var v = parseFloat(n) || 0;
  return v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function statusBadge(st) {
  st = (st||'active').toLowerCase().replace(/\s+/g,'-');
  var map = {active:'status-active', won:'status-won', lost:'status-lost', pending:'status-pending', 'on-hold':'status-hold'};
  var label = (st||'active').replace(/-/g,' ');
  label = label.charAt(0).toUpperCase() + label.slice(1);
  return '<span class="status-badge ' + (map[st]||'status-active') + '">' + label + '</span>';
}

function render(p) {
  var revs = p.revisions || [];

  // Find latest revision with a price
  var latest = null;
  var sorted = revs.slice().sort(function(a,b){return b.rNum - a.rNum;});
  for (var i=0; i<sorted.length; i++) {
    if (sorted[i].price) { latest = sorted[i]; break; }
  }

  // Pricing rows — R1 through R6
  var rows = '';

  // R1 row
  var r1val = parseFloat(p.r1NetCost||0) > 0;
  rows += '<tr' + (!latest && r1val ? ' class="latest-row"' : '') + '>'
    + '<td class="r-label">R1</td>'
    + '<td>Net Cost to TI</td>'
    + '<td class="divisor">—</td>'
    + '<td>' + (r1val ? '<span style="color:#555">$' + fmtN(p.r1NetCost) + '</span>' : '<span class="price-na">Not recorded</span>') + '</td>'
    + '</tr>';

  // R2–R6
  for (var ri = 2; ri <= 6; ri++) {
    var r = null;
    for (var vi=0; vi<revs.length; vi++) { if (revs[vi].rNum === ri) { r = revs[vi]; break; } }
    var isLatest = latest && latest.rNum === ri;
    rows += '<tr' + (isLatest ? ' class="latest-row"' : '') + '>'
      + '<td class="r-label">' + (isLatest ? '★ R' + ri : 'R' + ri) + '</td>'
      + '<td>' + (r && r.notes ? esc(r.notes) : 'Revision ' + ri) + '</td>'
      + '<td class="divisor">' + (r && r.divisor ? 'Div: ' + esc(r.divisor) : '—') + '</td>'
      + '<td class="' + (r && r.price ? 'price-val' : 'price-na') + '">'
      + (r && r.price ? '$' + fmtN(r.price) : 'Not issued') + '</td>'
      + '</tr>';
  }

  var html = '<div class="doc">';

  // Header
  html += '<div class="doc-header">'
    + '<div><div class="company-name">Technologies International LLC</div>'
    + '<div class="company-sub">Authorized Representative — Amatrol · DAC Worldwide · Bayport Technical</div>'
    + '<div class="company-sub" style="margin-top:2px">ti-kitmeer.com</div></div>'
    + '<div class="doc-label"><div class="title">QUOTATION</div>'
    + '<div class="quotenum">' + esc(p.quoteNum) + '</div></div>'
    + '</div>';

  // Meta grid
  html += '<div class="meta-grid">'
    + '<div class="meta-cell"><label>Quote Number</label><p>' + esc(p.quoteNum) + '</p></div>'
    + '<div class="meta-cell"><label>Date</label><p>' + esc(p.date||'—') + '</p></div>'
    + '<div class="meta-cell"><label>Status</label><p>' + statusBadge(p.status) + '</p></div>'
    + '<div class="meta-cell"><label>Currency</label><p>' + esc(p.currency||'USD') + '</p></div>'
    + '<div class="meta-cell"><label>Client / Organization</label><p>' + esc(p.clientName||'—') + '</p></div>'
    + '<div class="meta-cell"><label>Country</label><p>' + esc(p.country||'—') + '</p></div>'
    + '<div class="meta-cell full"><label>Equipment / Description</label><p>' + esc(p.equipment||'—') + '</p></div>'
    + '</div>';

  // Notes
  if (p.notes) {
    html += '<div class="sec-head">Notes</div>'
      + '<div class="notes-box">' + esc(p.notes) + '</div>';
  }

  // Pricing
  html += '<div class="sec-head">Pricing Summary</div>'
    + '<table class="price-table">'
    + '<thead><tr><th style="width:40px">Rev</th><th>Description</th><th style="width:100px">Divisor</th><th style="width:130px;text-align:right">Quoted Price</th></tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table>';

  // Latest price callout
  if (latest && latest.price) {
    html += '<div style="margin-top:18px;background:#fdf6e8;border:2px solid #f0c060;border-radius:6px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center">'
      + '<span style="font-size:13px;color:#7a4a00;font-weight:600">★ Latest Quoted Price (R' + latest.rNum + ')</span>'
      + '<span style="font-size:22px;font-weight:700;color:#2e7d32">$' + fmtN(latest.price) + ' ' + esc(p.currency||'USD') + '</span>'
      + '</div>';
  } else if (r1val) {
    html += '<div style="margin-top:18px;background:#f5f5f5;border:1px solid #ddd;border-radius:6px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center">'
      + '<span style="font-size:13px;color:#777;font-weight:600">Baseline Net Cost (R1)</span>'
      + '<span style="font-size:20px;font-weight:700;color:#555">$' + fmtN(p.r1NetCost) + ' ' + esc(p.currency||'USD') + '</span>'
      + '</div>';
  }

  // Footer
  html += '<div class="doc-footer">'
    + '<span>Technologies International LLC &nbsp;·&nbsp; New York, USA</span>'
    + '<span>Generated: ' + new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'}) + '</span>'
    + '</div>';

  html += '</div>';
  return html;
}

// Load data
var pid = getParam('id');
if (!pid) {
  document.getElementById('doc').innerHTML = '<div class="doc" style="text-align:center;padding:60px;color:#c00">No project ID specified in URL.</div>';
} else {
  fetch(API + '?action=list_projects')
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var projects = data.ok ? data.projects : [];
      var p = projects.find(function(x){ return x.id === pid || x.quoteNum === pid; });
      if (!p) {
        document.getElementById('doc').innerHTML = '<div class="doc" style="text-align:center;padding:60px;color:#c00">Quote not found: ' + esc(pid) + '</div>';
      } else {
        document.getElementById('doc').outerHTML = render(p);
        document.title = p.quoteNum + ' — TI Kitmeer Quotation';
      }
    })
    .catch(function(e){
      document.getElementById('doc').innerHTML = '<div class="doc" style="text-align:center;padding:60px;color:#c00">Error loading data: ' + e.message + '</div>';
    });
}
</script>
</body>
</html>
